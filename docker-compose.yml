services:
  postgres:
    image: postgres:16-alpine
    container_name: cortexmcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex_secret
      POSTGRES_DB: cortexmcp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortexmcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cortexmcp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexmcp-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://cortex:cortex_secret@postgres:5432/cortexmcp
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5175,http://localhost:5173,http://localhost:3000
    volumes:
      # Optional: Mount backend code for live reload in dev
      - ./backend:/app
      - chroma_data:/app/chroma_data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexmcp-celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://cortex:cortex_secret@postgres:5432/cortexmcp
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
    # Note: we drop the `-P solo` flag as it is usually only needed on Windows host machines,
    # and the container runs Linux.
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortexmcp-frontend
    restart: unless-stopped
    ports:
      - "5175:5173"
    environment:
      - VITE_API_URL=http://localhost:8001/api
    volumes:
      # Mount frontend code for live reload in dev
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  chroma_data:
